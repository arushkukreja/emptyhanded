<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>EmptyHanded — Design Prototype v3</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0F172A;--navy-2:#1E293B;--navy-3:#334155;
  --amber:#F59E0B;--amber-l:#FEF3C7;--amber-d:#D97706;
  --cream:#FAF8F4;--white:#FFFFFF;--wgray:#F5F0E8;
  --t1:#0F172A;--t2:#475569;--t3:#94A3B8;
  --bdr:#E8E2D9;--sh:0 4px 24px rgba(15,23,42,.08);--sh2:0 16px 48px rgba(15,23,42,.14);
  --r:16px;--rs:10px;--rp:100px;--nh:62px;
}
html,body{font-family:'DM Sans',system-ui,sans-serif;background:var(--cream);color:var(--t1);-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
button{font-family:inherit;cursor:pointer;border:none;outline:none}
input,textarea,select{font-family:inherit;outline:none;border:none}
img{display:block}
a{text-decoration:none;color:inherit;cursor:pointer}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:99px}

@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes floatB{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes floatC{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pulseU{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes scIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tfIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes mIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
@keyframes fabSpin{from{transform:rotate(0deg)}to{transform:rotate(90deg)}}

.sc-in{animation:scIn .35s cubic-bezier(.16,1,.3,1) both}
.a1{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .05s both}
.a2{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .12s both}
.a3{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .2s both}
.a4{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .28s both}
.a5{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .36s both}
.a6{animation:fadeUp .55s cubic-bezier(.16,1,.3,1) .44s both}
.sa{opacity:0;transform:translateY(26px);transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1)}
.sa.d1{transition-delay:.1s}.sa.d2{transition-delay:.2s}.sa.d3{transition-delay:.3s}
.sa.vis{opacity:1;transform:none}

/* SHARED */
.btn-navy{background:var(--navy);color:#fff;border-radius:var(--rp);padding:12px 24px;font-size:14px;font-weight:600;letter-spacing:-.01em;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-navy:hover{background:var(--navy-2);transform:translateY(-1px);box-shadow:0 8px 24px rgba(15,23,42,.2)}
.btn-amber{background:var(--amber);color:var(--navy);border-radius:var(--rp);padding:12px 24px;font-size:14px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-amber:hover{background:var(--amber-d);transform:translateY(-1px);box-shadow:0 8px 24px rgba(245,158,11,.28)}
.btn-outline{background:transparent;color:var(--navy);border:1.5px solid var(--navy);border-radius:var(--rp);padding:11px 24px;font-size:14px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-outline:hover{background:var(--navy);color:#fff}
.badge-am{background:var(--amber-l);color:#92400E;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--rp);display:inline-block}
.badge-nv{background:#EEF2FF;color:#3730A3;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--rp);display:inline-block}
.badge-urg{background:#FEE2E2;color:#991B1B;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--rp);display:inline-block;animation:pulseU 2s ease-in-out infinite}
.badge-ok{background:#F0FDF4;color:#166534;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--rp);display:inline-block}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(250,248,244,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bdr);height:var(--nh)}
.nav-inner{max-width:1280px;margin:0 auto;padding:0 28px;height:100%;display:flex;align-items:center;gap:3px}
.nav-logo{font-family:'Fraunces',serif;font-size:18px;font-weight:800;color:var(--navy);margin-right:16px;white-space:nowrap;flex-shrink:0;cursor:pointer}
.nav-logo span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:2px;vertical-align:middle;margin-bottom:2px}
.nav-tab{padding:6px 13px;border-radius:var(--rp);font-size:13px;font-weight:500;color:var(--t2);background:none;border:none;cursor:pointer;white-space:nowrap;transition:all .18s}
.nav-tab:hover{background:var(--wgray);color:var(--navy)}
.nav-tab.act{background:var(--navy);color:#fff}
.nav-sp{flex:1}
.nav-auth{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-login{padding:7px 14px;border-radius:var(--rp);font-size:13px;font-weight:600;color:var(--t2);background:none;border:none;cursor:pointer;transition:color .2s}
.nav-login:hover{color:var(--navy)}
.nav-signup{background:var(--navy);color:#fff;border-radius:var(--rp);padding:7px 16px;font-size:13px;font-weight:600;border:none;cursor:pointer;transition:all .2s}
.nav-signup:hover{background:var(--navy-2)}
/* signed in nav */
.nav-profile{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-notif{width:34px;height:34px;border-radius:50%;background:var(--wgray);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s;position:relative}
.nav-notif:hover{background:var(--bdr)}
.notif-dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:#EF4444;border:2px solid var(--cream)}
.nav-av{width:34px;height:34px;border-radius:50%;background:var(--amber-l);color:#92400E;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid var(--amber-l);transition:border-color .2s}
.nav-av:hover{border-color:var(--amber)}

/* MINI CALENDAR (hero) */
.mini-cal{background:var(--white);border-radius:14px;border:1px solid var(--bdr);padding:14px 13px;width:262px;box-shadow:var(--sh)}
.cal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-month{font-family:'Fraunces',serif;font-size:13px;font-weight:700;color:var(--navy)}
.cal-nb{background:none;border:none;cursor:pointer;color:var(--t3);font-size:14px;padding:2px 6px;border-radius:6px;transition:all .15s}
.cal-nb:hover{background:var(--wgray);color:var(--navy)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:5px}
.cal-dow span{text-align:center;font-size:10px;font-weight:700;color:var(--t3)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.cc{text-align:center;padding:4px 2px;font-size:11px;font-weight:500;color:var(--t2);border-radius:6px;position:relative;cursor:default;min-height:26px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cc.today{background:var(--navy);color:#fff;font-weight:700}
.cc.ev{color:#92400E;font-weight:700}.cc.ev-u{color:#991B1B;font-weight:700}
.cc .dot{width:3px;height:3px;border-radius:50%;background:var(--amber);margin-top:1px}
.cc.ev-u .dot{background:#EF4444}.cc.today .dot{background:rgba(255,255,255,.65)}
.cal-leg{margin-top:10px;padding-top:9px;border-top:1px solid var(--bdr);display:flex;flex-direction:column;gap:4px}
.cal-leg-i{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--t2)}
.cal-leg-d{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* HERO */
.hero{max-width:1280px;margin:0 auto;padding:80px 40px 60px;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;min-height:calc(100vh - var(--nh))}
.hero h1{font-family:'Fraunces',serif;font-size:60px;font-weight:900;line-height:1;letter-spacing:-.03em;color:var(--navy)}
.hero h1 em{font-style:italic;color:var(--amber)}
.hero-sub{font-size:17px;color:var(--t2);line-height:1.68;margin:20px 0 30px;max-width:420px}
.hero-form{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.hero-inp{background:var(--white);border:1.5px solid var(--bdr);border-radius:var(--rp);padding:12px 20px;font-size:14px;color:var(--navy);width:238px;transition:border-color .2s}
.hero-inp:focus{border-color:var(--amber)}
.hero-r{position:relative;height:530px}
.hc-cal{position:absolute;top:0;left:10px;z-index:2;animation:floatA 5s ease-in-out infinite}
.hc-picks{position:absolute;top:16px;right:0;z-index:3;background:var(--white);border-radius:15px;border:1px solid var(--bdr);padding:16px;width:210px;box-shadow:var(--sh);animation:floatB 5.5s ease-in-out 1s infinite}
.hc-profile{position:absolute;bottom:8px;left:0;z-index:3;background:var(--white);border-radius:15px;border:1px solid var(--bdr);padding:15px;width:230px;box-shadow:var(--sh);animation:floatC 4.5s ease-in-out .5s infinite}
.hc-badge{position:absolute;top:6px;right:4px;z-index:4;background:var(--amber);color:var(--navy);padding:8px 13px;border-radius:var(--rp);font-size:11px;font-weight:700;box-shadow:0 6px 18px rgba(245,158,11,.38);animation:floatA 3.5s ease-in-out 2s infinite}

/* LANDING SECTIONS */
.lsec{padding:88px 40px}
.lsec-in{max-width:1280px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--amber);margin-bottom:12px}
.sec-h{font-family:'Fraunces',serif;font-size:44px;font-weight:700;color:var(--navy);letter-spacing:-.025em;line-height:1.1;margin-bottom:12px}
.steps-g{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
.sn{font-family:'Fraunces',serif;font-size:50px;font-weight:900;color:var(--amber-l);line-height:1;margin-bottom:12px}
.st{font-family:'Fraunces',serif;font-size:21px;font-weight:700;color:var(--navy);margin-bottom:9px}
.sd{font-size:15px;color:var(--t2);line-height:1.68}
.feat-strip{background:var(--navy);padding:76px 40px}
.feat-in{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:44px}
.fi-icon{font-size:34px;margin-bottom:14px}
.fi-t{font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:#fff;margin-bottom:7px}
.fi-d{font-size:14px;color:rgba(255,255,255,.55);line-height:1.65}
.price-g{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:740px;margin:0 auto}
.pc{background:var(--white);border-radius:22px;border:1px solid var(--bdr);padding:34px}
.pc.feat{border:2px solid var(--navy);background:var(--navy)}
.pc-plan{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.pc.feat .pc-plan{color:rgba(255,255,255,.45)}
.pc-amt{font-family:'Fraunces',serif;font-size:50px;font-weight:900;color:var(--navy);line-height:1}
.pc.feat .pc-amt{color:#fff}
.pc-per{font-size:13px;color:var(--t3);margin-bottom:26px;margin-top:3px}
.pc.feat .pc-per{color:rgba(255,255,255,.4)}
.pc-f{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);margin-bottom:10px}
.pc.feat .pc-f{color:rgba(255,255,255,.75)}
.ck{width:16px;height:16px;border-radius:50%;background:var(--amber-l);display:flex;align-items:center;justify-content:center;font-size:9px;color:#92400E;flex-shrink:0;font-weight:700}
.pc.feat .ck{background:rgba(245,158,11,.18);color:var(--amber)}

/* FOOTER */
footer{background:var(--navy);padding:56px 40px 0}
.foot-in{max-width:1280px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:44px;padding-bottom:44px;border-bottom:1px solid rgba(255,255,255,.1)}
.foot-logo{font-family:'Fraunces',serif;font-size:20px;font-weight:800;color:#fff;margin-bottom:10px}
.foot-logo span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-left:2px;vertical-align:middle;margin-bottom:2px}
.foot-tag{font-size:13px;color:rgba(255,255,255,.45);line-height:1.65;margin-bottom:22px;max-width:220px}
.foot-ct{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:14px}
.foot-lk{display:block;font-size:13px;color:rgba(255,255,255,.6);margin-bottom:9px;cursor:pointer;transition:color .2s}
.foot-lk:hover{color:#fff}
.foot-bot{max-width:1280px;margin:0 auto;padding:18px 0;display:flex;align-items:center;justify-content:space-between}
.foot-copy{font-size:12px;color:rgba(255,255,255,.3)}
.foot-leg{display:flex;gap:18px}
.foot-leg a{font-size:12px;color:rgba(255,255,255,.3);cursor:pointer;transition:color .2s}
.foot-leg a:hover{color:rgba(255,255,255,.65)}

/* DASHBOARD */
.dash{max-width:1280px;margin:0 auto;padding:calc(var(--nh) + 32px) 40px 0}
.dash-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:28px}
.dash-greet-sub{font-size:12px;color:var(--t3);margin-bottom:4px;font-weight:500}
.dash-greet{font-family:'Fraunces',serif;font-size:32px;font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.15}
.dash-greet em{font-style:italic;color:var(--amber)}
/* stats row */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--white);border-radius:var(--rs);border:1px solid var(--bdr);padding:16px 18px;transition:all .2s}
.stat-card:hover{box-shadow:var(--sh)}
.stat-num{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.stat-lbl{font-size:12px;color:var(--t3);margin-top:2px;font-weight:500}
.stat-card.urg .stat-num{color:#DC2626}
.stat-card.urg .stat-lbl{color:#FCA5A5}
/* urgent banner */
.urg-banner{background:var(--navy);border-radius:var(--r);padding:18px 24px;display:flex;align-items:center;gap:16px;margin-bottom:28px;position:relative;overflow:hidden}
.urg-banner::before{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(245,158,11,.08);border-radius:50%}
.urg-banner::after{content:'';position:absolute;right:20px;bottom:-30px;width:80px;height:80px;background:rgba(245,158,11,.06);border-radius:50%}
.urg-txt-main{font-size:15px;font-weight:700;color:#fff}
.urg-txt-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
/* filter tabs */
.filter-tabs{display:flex;gap:4px;margin-bottom:20px}
.ftab{padding:6px 14px;border-radius:var(--rp);font-size:12px;font-weight:600;background:none;border:none;cursor:pointer;color:var(--t2);transition:all .18s}
.ftab:hover{background:var(--wgray)}
.ftab.act{background:var(--navy);color:#fff}
/* compact event list */
.evt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:40px}
.el-item{background:var(--white);border-radius:var(--rs);border:1px solid var(--bdr);padding:14px 18px;display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;cursor:pointer;transition:all .22s cubic-bezier(.16,1,.3,1);position:relative;overflow:hidden}
.el-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--amber);transform:scaleY(0);transition:transform .25s ease;transform-origin:center}
.el-item:hover{transform:translateX(4px);box-shadow:var(--sh)}
.el-item:hover::before{transform:scaleY(1)}
.el-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.el-name{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.el-meta{font-size:12px;color:var(--t3);margin-top:2px;display:flex;align-items:center;gap:8px}
.el-meta-dot{width:3px;height:3px;border-radius:50%;background:var(--t3)}
.el-saved{font-size:11px;color:var(--amber-d);font-weight:600;margin-top:3px;display:flex;align-items:center;gap:4px}
.el-right{text-align:right}
.el-cta{font-size:12px;font-weight:600;color:var(--t3);margin-top:4px;white-space:nowrap}
.el-item:hover .el-cta{color:var(--navy)}
/* section heading row */
.sec-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sec-lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--t3);display:flex;align-items:center;gap:8px}
.cnt-pill{background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px}
/* FAB */
.fab{position:fixed;bottom:28px;right:28px;width:54px;height:54px;border-radius:50%;background:var(--navy);color:#fff;font-size:26px;box-shadow:0 8px 24px rgba(15,23,42,.28);z-index:150;display:flex;align-items:center;justify-content:center;transition:all .25s cubic-bezier(.16,1,.3,1);border:none;cursor:pointer;line-height:1}
.fab:hover{background:var(--amber);color:var(--navy);transform:scale(1.1) rotate(90deg);box-shadow:0 12px 32px rgba(245,158,11,.38)}

/* TYPEFORM */
.tf-wrap{min-height:100vh;display:flex;flex-direction:column;background:var(--cream);padding-top:var(--nh)}
.tf-prog-bar{height:3px;background:var(--bdr);position:relative}
.tf-prog-fill{height:100%;background:var(--amber);transition:width .4s cubic-bezier(.16,1,.3,1);border-radius:0 99px 99px 0}
.tf-step-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px 60px}
.tf-content{animation:tfIn .4s cubic-bezier(.16,1,.3,1) both;width:100%;max-width:600px;display:flex;flex-direction:column;align-items:center;text-align:center}
.tf-q{font-family:'Fraunces',serif;font-size:38px;font-weight:700;color:var(--navy);letter-spacing:-.025em;margin-bottom:10px;line-height:1.1}
.tf-sub{font-size:15px;color:var(--t2);margin-bottom:36px}
.tf-hint{font-size:12px;color:var(--t3);margin-top:14px}
.tf-inp{background:var(--white);border:2px solid var(--bdr);border-radius:var(--r);padding:16px 20px;font-size:18px;color:var(--navy);width:100%;max-width:460px;transition:border-color .2s;text-align:left;font-family:'DM Sans',sans-serif}
.tf-inp:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 4px rgba(245,158,11,.1)}
.tf-textarea{background:var(--white);border:2px solid var(--bdr);border-radius:var(--r);padding:16px 20px;font-size:16px;color:var(--navy);width:100%;max-width:460px;transition:border-color .2s;resize:none;font-family:'DM Sans',sans-serif;min-height:120px}
.tf-textarea:focus{border-color:var(--amber);outline:none;box-shadow:0 0 0 4px rgba(245,158,11,.1)}
.tf-occ-g{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:520px}
.tf-oi{background:var(--white);border:2px solid var(--bdr);border-radius:var(--rs);padding:16px 10px;text-align:center;cursor:pointer;transition:all .2s}
.tf-oi:hover{border-color:var(--amber-d);background:var(--amber-l)}
.tf-oi.sel{border-color:var(--navy);background:var(--navy)}
.tf-oi-em{font-size:26px;margin-bottom:6px}
.tf-oi-lb{font-size:12px;font-weight:600;color:var(--t2)}.tf-oi.sel .tf-oi-lb{color:#fff}
.tf-rel-g{display:flex;flex-direction:column;gap:8px;width:100%;max-width:380px}

/* ─── TYPEFORM ADD EVENT ─── */
const AddEvent = ({go}) => {
  const STEPS = [
    {key:'occ',type:'occ',q:"What's the occasion?",sub:"We'll tailor everything around this."},
    {key:'name',type:'text',q:"Who's it for?",sub:"Just their first name is fine.",ph:"Sarah, Mom, Jake...",hint:"Press Enter to continue"},
    {key:'date',type:'date',q:"When is it?",sub:"We'll set your reminder 7 days before."},
    {key:'rel',type:'rel',q:"How do you know them?",sub:"Helps us understand the relationship dynamic."},
    {key:'arch',type:'multi',q:"How would you describe them?",sub:"Pick all that apply — more is better."},
    {key:'interests',type:'textarea',q:"What are they into?",sub:"The more detail, the better the picks.",ph:"Coffee, yoga, plants, true crime podcasts...",hint:"Optional — skip if you're not sure"},
    {key:'budget',type:'budget',q:"What's your budget?",sub:"Including tax and shipping is a good idea."},
    {key:'past',type:'textarea',q:"Any past gifts to avoid?",sub:"We'll make sure not to repeat them.",ph:"Got them a candle last year, gave a cookbook...",hint:"Optional — skip if first time gifting"},
  ];
  const [step,setStep]=useState(0);
  const [answers,setAnswers]=useState({occ:'birthday',name:'',date:'',rel:'',arch:[],interests:'',budget:'',past:''});
  const [sk,setSk]=useState(0);
  const [showSummary,setShowSummary]=useState(false);
  const [editStep,setEditStep]=useState(null);

  const total = STEPS.length;
  const pct = Math.round((step/total)*100);
  const cur = STEPS[step];

  const ans = (k,v) => setAnswers(a=>({...a,[k]:v}));
  const toggleArch = a => setAnswers(prev=>({...prev,arch:prev.arch.includes(a)?prev.arch.filter(x=>x!==a):[...prev.arch,a]}));

  const next = () => {
    if(step<total-1){setStep(s=>s+1);setSk(k=>k+1);}
    else{setShowSummary(true);}
  };
  const back = () => {
    if(showSummary){setShowSummary(false);}
    else if(step>0){setStep(s=>s-1);setSk(k=>k+1);}
    else{go('Dashboard');}
  };
  const jumpTo = i => {setEditStep(i);setStep(i);setSk(k=>k+1);setShowSummary(false);};
  const doneEditing = () => {setEditStep(null);setShowSummary(true);setSk(k=>k+1);};

  const autoNext = (k,v) => {ans(k,v);setTimeout(()=>{if(step<total-1){setStep(s=>s+1);setSk(k=>k+1);}else setShowSummary(true);},220);};

  const occLabel = OCCASIONS.find(o=>o.id===answers.occ);
  const sumRows = [
    {lbl:'Occasion',val:occLabel?`${occLabel.em} ${occLabel.lb}`:'—',i:0},
    {lbl:'Recipient',val:answers.name||'—',i:1},
    {lbl:'Date',val:answers.date||'—',i:2},
    {lbl:'Relationship',val:answers.rel||'—',i:3},
    {lbl:'Personality',val:answers.arch.length?answers.arch.join(', '):'—',i:4},
    {lbl:'Interests',val:answers.interests||'None provided',i:5},
    {lbl:'Budget',val:answers.budget||'—',i:6},
    {lbl:'Past gifts',val:answers.past||'None provided',i:7},
  ];

  if(showSummary) return (
    <div className="tf-wrap" style={{justifyContent:'flex-start'}}>
      <div className="tf-prog-bar"><div className="tf-prog-fill" style={{width:'100%'}}/></div>
      <div style={{maxWidth:640,margin:'0 auto',padding:'48px 24px 60px',width:'100%'}}>
        <button className="tf-back-btn a1" onClick={back}>← Back</button>
        <div style={{marginTop:8}}>
          <div className="tf-sum-head a1">🎉 {answers.name?"You're all set for "+answers.name+"!":'Ready to find the perfect gift!'}</div>
          <p className="tf-sum-sub a2">Review your details below. Click edit on anything you'd like to change.</p>
          <div className="sum-items a3">
            {sumRows.map((r,i)=>(
              <div key={i} className="sum-row">
                <div style={{flex:1}}><div className="sum-lbl">{r.lbl}</div><div className="sum-val" style={{maxWidth:400,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:r.lbl==='Personality'||r.lbl==='Interests'||r.lbl==='Past gifts'?'normal':'nowrap'}}>{r.val}</div></div>
                <button className="sum-edit" onClick={()=>jumpTo(r.i)}>Edit</button>
              </div>
            ))}
          </div>
          <div style={{display:'flex',gap:10,marginTop:24}}>
            <button className="btn-amber" style={{flex:1,justifyContent:'center'}} onClick={()=>go('Recommendations')}>✨ Get my recommendations</button>
          </div>
        </div>
      </div>
    </div>
  );

  return (
    <div className="tf-wrap" style={{position:'relative'}}>
      <div className="tf-prog-bar"><div className="tf-prog-fill" style={{width:`${pct}%`}}/></div>
      <div style={{position:'absolute',top:'calc(var(--nh) + 14px)',left:24}}><button className="tf-back-btn" onClick={back}>← Back</button></div>
      <div style={{position:'absolute',top:'calc(var(--nh) + 18px)',right:24,fontSize:12,fontWeight:600,color:'var(--t3)'}}>{step+1} / {total}</div>
      <div className="tf-step-area">
        <div key={sk} className="tf-content">
          <div className="tf-q">{cur.q}</div>
          {cur.sub&&<p className="tf-sub">{cur.sub}</p>}

          {cur.type==='occ'&&<div className="tf-occ-g">{OCCASIONS.map(o=><div key={o.id} className={`tf-oi${answers.occ===o.id?' sel':''}`} onClick={()=>autoNext('occ',o.id)}><div className="tf-oi-em">{o.em}</div><div className="tf-oi-lb">{o.lb}</div></div>)}</div>}

          {cur.type==='text'&&<><input className="tf-inp" placeholder={cur.ph} value={answers[cur.key]} onChange={e=>ans(cur.key,e.target.value)} onKeyDown={e=>e.key==='Enter'&&answers[cur.key].trim()&&next()} autoFocus/>{cur.hint&&<p className="tf-enter-hint">⏎ {cur.hint}</p>}<div className="tf-nav-row"><button className="tf-continue" onClick={next}>Continue →</button>{editStep!==null&&<button className="tf-skip" onClick={doneEditing}>Done editing</button>}</div></>}

          {cur.type==='date'&&<><input className="tf-inp" type="date" value={answers.date} onChange={e=>ans('date',e.target.value)} style={{maxWidth:320}} autoFocus/><div className="tf-nav-row"><button className="tf-continue" onClick={next}>Continue →</button></div></>}

          {cur.type==='rel'&&<div className="tf-rel-g">{RELATIONSHIPS.map(r=><div key={r.lb} className={`tf-ri${answers.rel===r.lb?' sel':''}`} onClick={()=>autoNext('rel',r.lb)}><span className="tf-ri-em">{r.em}</span>{r.lb}</div>)}</div>}

          {cur.type==='multi'&&<><div className="tf-arch-g">{ARCHETYPES.map(a=><div key={a} className={`tf-ap${answers.arch.includes(a)?' sel':''}`} onClick={()=>toggleArch(a)}>{a}</div>)}</div><div className="tf-nav-row"><button className="tf-continue" onClick={next} disabled={answers.arch.length===0} style={{opacity:answers.arch.length?1:.45}}>Continue{answers.arch.length>0?` (${answers.arch.length} selected)`:''} →</button></div></>}

          {cur.type==='textarea'&&<><textarea className="tf-textarea" placeholder={cur.ph} value={answers[cur.key]} onChange={e=>ans(cur.key,e.target.value)} autoFocus/><div className="tf-nav-row"><button className="tf-continue" onClick={next}>Continue →</button><button className="tf-skip" onClick={next}>Skip →</button></div>{cur.hint&&<p className="tf-hint">{cur.hint}</p>}</>}

          {cur.type==='budget'&&<div className="tf-bud-g">{BUDGETS.map(([b,sub])=><div key={b} className={`tf-bi${answers.budget===b?' sel':''}`} onClick={()=>autoNext('budget',b)}><span>{b}</span><span style={{fontSize:11,opacity:.6}}>{sub}</span></div>)}</div>}
        </div>
      </div>
    </div>
  );
};

        {screen==='Signup'&&<Signup go={go}/>}
        {screen==='Terms'&&<LegalPage sections={TERMS} title="Terms & Conditions" badge="badge-am" go={go}/>}
        {screen==='Privacy'&&<LegalPage sections={PRIVACY} title="Privacy Policy" badge="badge-nv" go={go}/>}
      </div>
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
